<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialectic</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a0b;
            --surface: #141416;
            --surface-2: #1c1c1f;
            --border: #2a2a2e;
            --text: #e4e4e7;
            --text-dim: #71717a;
            --accent: #6366f1;
            --accent-dim: #4f46e5;
            --human-bg: #1e1e24;
            --llm-bg: #1a1a2e;
            --provoker-bg: #2a1a1a;
            --system-bg: #1a1a1a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Setup Screen */
        #setup {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
        }

        #setup h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
        }

        #setup p {
            color: var(--text-dim);
            margin-bottom: 2rem;
        }

        .setup-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .setup-form h2 {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-dim);
        }

        .btn-secondary {
            background: var(--surface-2);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .setup-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .setup-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .setup-tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Main App */
        #app {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        #app.active {
            display: flex;
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .room-name {
            font-weight: 500;
        }

        .thread-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .thread-selector select {
            padding: 0.5rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
        }

        .status-dot.connected {
            background: #22c55e;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 12px;
            position: relative;
        }

        .message.human {
            background: var(--human-bg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.llm_primary {
            background: var(--llm-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid var(--accent);
        }

        .message.llm_provoker {
            background: var(--provoker-bg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #f59e0b;
        }

        .message.system {
            background: var(--system-bg);
            align-self: center;
            font-style: italic;
            color: var(--text-dim);
            font-size: 0.875rem;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .message-author {
            font-weight: 500;
            color: var(--text);
        }

        .message-type {
            padding: 0.125rem 0.375rem;
            background: var(--surface-2);
            border-radius: 4px;
            font-size: 0.625rem;
            text-transform: uppercase;
        }

        .message-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-actions {
            display: none;
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            gap: 0.25rem;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-action {
            padding: 0.25rem 0.5rem;
            background: var(--surface-2);
            border: none;
            border-radius: 4px;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .message-action:hover {
            background: var(--border);
            color: var(--text);
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            color: var(--text-dim);
            font-size: 0.875rem;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 0.25rem;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        /* Input Area */
        .input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .message-type-selector {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 0.5rem;
        }

        .type-btn {
            padding: 0.25rem 0.5rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
        }

        .type-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        #messageInput {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            resize: none;
            min-height: 44px;
            max-height: 200px;
        }

        #messageInput:focus {
            outline: none;
            border-color: var(--accent);
        }

        #sendBtn {
            padding: 0.75rem 1.25rem;
            height: 44px;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            border-left: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }

        .sidebar-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-tab {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.875rem;
            border-bottom: 2px solid transparent;
        }

        .sidebar-tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .sidebar-panel {
            display: none;
        }

        .sidebar-panel.active {
            display: block;
        }

        /* Memory Panel */
        .memory-item {
            padding: 0.75rem;
            background: var(--surface-2);
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }

        .memory-key {
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 0.25rem;
            font-family: monospace;
        }

        .memory-content {
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .memory-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .add-memory-form {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .add-memory-form input,
        .add-memory-form textarea {
            width: 100%;
            padding: 0.5rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .add-memory-form button {
            width: 100%;
        }

        /* Thread Panel */
        .thread-item {
            padding: 0.75rem;
            background: var(--surface-2);
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .thread-item:hover {
            background: var(--border);
        }

        .thread-item.active {
            border-left: 3px solid var(--accent);
        }

        .thread-title {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .thread-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .fork-btn {
            display: block;
            width: 100%;
            margin-top: 1rem;
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-dim);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
        }

        .modal h3 {
            margin-bottom: 1rem;
        }

        /* Share Link */
        .share-link {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            padding: 1rem;
            background: var(--surface-2);
            border-radius: 8px;
        }

        .share-link input {
            flex: 1;
            padding: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-family: monospace;
            font-size: 0.875rem;
        }

        .share-link button {
            padding: 0.5rem 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Setup Screen -->
    <div id="setup">
        <h1>Dialectic</h1>
        <p>A shared thinking space</p>

        <div class="setup-form">
            <div class="setup-tabs">
                <button class="setup-tab active" data-tab="create">Create Room</button>
                <button class="setup-tab" data-tab="join">Join Room</button>
            </div>

            <div id="createTab" class="tab-content active">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="createName" placeholder="How should others see you?">
                </div>
                <div class="form-group">
                    <label>Room Name (optional)</label>
                    <input type="text" id="roomName" placeholder="e.g., Philosophy Club">
                </div>
                <button class="btn" id="createRoomBtn" style="width: 100%;">Create Room</button>
            </div>

            <div id="joinTab" class="tab-content">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="joinName" placeholder="How should others see you?">
                </div>
                <div class="form-group">
                    <label>Room Link</label>
                    <input type="text" id="roomLink" placeholder="Paste the link you received">
                </div>
                <button class="btn" id="joinRoomBtn" style="width: 100%;">Join Room</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <header>
            <div class="room-info">
                <span class="room-name" id="roomNameDisplay">Room</span>
                <div class="thread-selector">
                    <select id="threadSelect"></select>
                </div>
            </div>
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="main-content">
            <div class="messages-container">
                <div id="messages"></div>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                    <span id="typingText">Claude is thinking...</span>
                </div>
                <div class="input-area">
                    <div class="message-type-selector">
                        <button class="type-btn active" data-type="text">Text</button>
                        <button class="type-btn" data-type="claim">Claim</button>
                        <button class="type-btn" data-type="question">Question</button>
                        <button class="type-btn" data-type="definition">Definition</button>
                    </div>
                    <div class="input-container">
                        <textarea id="messageInput" placeholder="Type a message... (use @llm to summon Claude)" rows="1"></textarea>
                        <button class="btn" id="sendBtn">Send</button>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-panel="memory">Memory</button>
                    <button class="sidebar-tab" data-panel="threads">Threads</button>
                    <button class="sidebar-tab" data-panel="share">Share</button>
                </div>
                <div class="sidebar-content">
                    <div id="memoryPanel" class="sidebar-panel active">
                        <div class="add-memory-form">
                            <input type="text" id="memoryKey" placeholder="Key (e.g., definition:truth)">
                            <textarea id="memoryContent" placeholder="What should be remembered?" rows="2"></textarea>
                            <button class="btn btn-secondary" id="addMemoryBtn">Add Memory</button>
                        </div>
                        <div id="memoryList"></div>
                    </div>
                    <div id="threadsPanel" class="sidebar-panel">
                        <div id="threadList"></div>
                        <button class="btn btn-secondary fork-btn" id="forkThreadBtn">Fork from last message</button>
                    </div>
                    <div id="sharePanel" class="sidebar-panel">
                        <p style="margin-bottom: 1rem; color: var(--text-dim);">Share this link with your friend to invite them:</p>
                        <div class="share-link">
                            <input type="text" id="shareLink" readonly>
                            <button class="btn btn-secondary" id="copyLinkBtn">Copy</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fork Modal -->
    <div class="modal-overlay" id="forkModal">
        <div class="modal">
            <h3>Fork Thread</h3>
            <div class="form-group">
                <label>New Thread Title</label>
                <input type="text" id="forkTitle" placeholder="What's this branch about?">
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-secondary" id="cancelForkBtn" style="flex: 1;">Cancel</button>
                <button class="btn" id="confirmForkBtn" style="flex: 1;">Fork</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        const state = {
            apiUrl: 'http://localhost:8000',
            wsUrl: 'ws://localhost:8000',
            roomId: null,
            roomToken: null,
            userId: null,
            userName: null,
            currentThreadId: null,
            threads: [],
            memories: [],
            messages: [],
            ws: null,
            messageType: 'text',
            lastMessageId: null,
        };

        // ============================================================
        // ELEMENTS
        // ============================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        // ============================================================
        // API HELPERS
        // ============================================================
        async function api(method, path, body = null) {
            const url = new URL(path, state.apiUrl);
            if (state.roomToken) url.searchParams.set('token', state.roomToken);
            if (state.userId) url.searchParams.set('user_id', state.userId);

            const opts = {
                method,
                headers: { 'Content-Type': 'application/json' },
            };
            if (body) opts.body = JSON.stringify(body);

            const res = await fetch(url, opts);
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: res.statusText }));
                throw new Error(err.detail || 'API error');
            }
            return res.json();
        }

        // ============================================================
        // SETUP
        // ============================================================
        function initSetup() {
            // Tab switching
            $$('.setup-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    $$('.setup-tab').forEach(t => t.classList.remove('active'));
                    $$('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    $(`#${tab.dataset.tab}Tab`).classList.add('active');
                });
            });

            // Create room
            $('#createRoomBtn').addEventListener('click', async () => {
                const name = $('#createName').value.trim();
                if (!name) return alert('Please enter your name');

                try {
                    // Create user
                    const user = await api('POST', '/users', { display_name: name });
                    state.userId = user.id;
                    state.userName = name;

                    // Create room
                    const room = await api('POST', '/rooms', { name: $('#roomName').value.trim() || 'Untitled Room' });
                    state.roomId = room.id;
                    state.roomToken = room.token;

                    // Join room
                    await api('POST', `/rooms/${room.id}/join`, { user_id: user.id });

                    // Save to localStorage
                    saveSession();

                    // Enter app
                    enterApp(room.name || 'Untitled Room');
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            });

            // Join room
            $('#joinRoomBtn').addEventListener('click', async () => {
                const name = $('#joinName').value.trim();
                const link = $('#roomLink').value.trim();
                if (!name) return alert('Please enter your name');
                if (!link) return alert('Please enter the room link');

                try {
                    // Parse link
                    const url = new URL(link);
                    const roomId = url.searchParams.get('room');
                    const token = url.searchParams.get('token');
                    if (!roomId || !token) throw new Error('Invalid link');

                    state.roomId = roomId;
                    state.roomToken = token;

                    // Create user
                    const user = await api('POST', '/users', { display_name: name });
                    state.userId = user.id;
                    state.userName = name;

                    // Join room
                    await api('POST', `/rooms/${roomId}/join`, { user_id: user.id });

                    // Save to localStorage
                    saveSession();

                    // Enter app
                    enterApp('Room');
                } catch (e) {
                    alert('Error: ' + e.message);
                }
            });

            // Check for existing session
            loadSession();
        }

        function saveSession() {
            localStorage.setItem('dialectic_session', JSON.stringify({
                roomId: state.roomId,
                roomToken: state.roomToken,
                userId: state.userId,
                userName: state.userName,
            }));
        }

        function loadSession() {
            const saved = localStorage.getItem('dialectic_session');
            if (saved) {
                const session = JSON.parse(saved);
                Object.assign(state, session);
                enterApp('Room');
            }
        }

        // ============================================================
        // MAIN APP
        // ============================================================
        async function enterApp(roomName) {
            $('#setup').style.display = 'none';
            $('#app').classList.add('active');
            $('#roomNameDisplay').textContent = roomName;

            // Generate share link
            const shareUrl = new URL(window.location.href);
            shareUrl.searchParams.set('room', state.roomId);
            shareUrl.searchParams.set('token', state.roomToken);
            $('#shareLink').value = shareUrl.toString();

            // Load initial data
            await Promise.all([
                loadThreads(),
                loadMemories(),
            ]);

            // Connect WebSocket
            connectWebSocket();

            // Init UI handlers
            initApp();
        }

        function initApp() {
            // Message type selector
            $$('.type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    $$('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.messageType = btn.dataset.type;
                });
            });

            // Send message
            $('#sendBtn').addEventListener('click', sendMessage);
            $('#messageInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Auto-resize textarea
            $('#messageInput').addEventListener('input', () => {
                const el = $('#messageInput');
                el.style.height = 'auto';
                el.style.height = Math.min(el.scrollHeight, 200) + 'px';
            });

            // Sidebar tabs
            $$('.sidebar-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    $$('.sidebar-tab').forEach(t => t.classList.remove('active'));
                    $$('.sidebar-panel').forEach(p => p.classList.remove('active'));
                    tab.classList.add('active');
                    $(`#${tab.dataset.panel}Panel`).classList.add('active');
                });
            });

            // Add memory
            $('#addMemoryBtn').addEventListener('click', addMemory);

            // Fork thread
            $('#forkThreadBtn').addEventListener('click', () => {
                if (!state.lastMessageId) {
                    alert('No messages to fork from');
                    return;
                }
                $('#forkModal').classList.add('active');
            });

            $('#cancelForkBtn').addEventListener('click', () => {
                $('#forkModal').classList.remove('active');
            });

            $('#confirmForkBtn').addEventListener('click', forkThread);

            // Copy share link
            $('#copyLinkBtn').addEventListener('click', () => {
                $('#shareLink').select();
                document.execCommand('copy');
                $('#copyLinkBtn').textContent = 'Copied!';
                setTimeout(() => $('#copyLinkBtn').textContent = 'Copy', 2000);
            });

            // Thread selector
            $('#threadSelect').addEventListener('change', (e) => {
                const threadId = e.target.value;
                switchThread(threadId);
            });
        }

        // ============================================================
        // WEBSOCKET
        // ============================================================
        function connectWebSocket() {
            const url = `${state.wsUrl}/ws/${state.roomId}?token=${state.roomToken}&user_id=${state.userId}`;
            state.ws = new WebSocket(url);

            state.ws.onopen = () => {
                updateConnectionStatus(true);
            };

            state.ws.onclose = () => {
                updateConnectionStatus(false);
                // Reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };

            state.ws.onerror = (e) => {
                console.error('WebSocket error:', e);
            };

            state.ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                handleServerMessage(msg);
            };
        }

        function updateConnectionStatus(connected) {
            $('#statusDot').classList.toggle('connected', connected);
            $('#statusText').textContent = connected ? 'Connected' : 'Disconnected';
        }

        function send(type, payload) {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ type, payload }));
            }
        }

        function handleServerMessage(msg) {
            switch (msg.type) {
                case 'message_created':
                    addMessageToUI(msg.payload);
                    break;
                case 'llm_thinking':
                    showTypingIndicator(true, 'Claude is thinking...');
                    break;
                case 'user_typing':
                    if (msg.payload.typing) {
                        showTypingIndicator(true, 'Someone is typing...');
                    } else {
                        showTypingIndicator(false);
                    }
                    break;
                case 'memory_updated':
                    loadMemories();
                    break;
                case 'thread_created':
                    loadThreads();
                    break;
                case 'user_joined':
                    console.log('User joined:', msg.payload.user_id);
                    break;
                case 'user_left':
                    console.log('User left:', msg.payload.user_id);
                    break;
                case 'error':
                    console.error('Server error:', msg.payload.error);
                    break;
            }
        }

        // ============================================================
        // MESSAGES
        // ============================================================
        async function loadMessages(threadId) {
            try {
                const messages = await api('GET', `/threads/${threadId}/messages`);
                state.messages = messages;
                renderMessages();
            } catch (e) {
                console.error('Failed to load messages:', e);
            }
        }

        function renderMessages() {
            const container = $('#messages');
            container.innerHTML = '';

            if (state.messages.length === 0) {
                container.innerHTML = '<div class="empty-state">No messages yet. Start the conversation!</div>';
                return;
            }

            state.messages.forEach(msg => {
                addMessageToUI(msg, false);
            });

            scrollToBottom();
        }

        function addMessageToUI(msg, scroll = true) {
            const container = $('#messages');

            // Remove empty state if present
            const emptyState = container.querySelector('.empty-state');
            if (emptyState) emptyState.remove();

            const div = document.createElement('div');
            div.className = `message ${msg.speaker_type}`;
            div.dataset.id = msg.id;

            const isHuman = msg.speaker_type === 'human';
            const authorName = msg.user_name || (isHuman ? 'You' : msg.speaker_type === 'llm_provoker' ? 'Provoker' : 'Claude');

            div.innerHTML = `
                <div class="message-header">
                    <span class="message-author">${authorName}</span>
                    ${msg.message_type !== 'text' ? `<span class="message-type">${msg.message_type}</span>` : ''}
                    <span>${formatTime(msg.created_at)}</span>
                </div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-actions">
                    <button class="message-action" onclick="forkFromMessage('${msg.id}')">Fork</button>
                </div>
            `;

            container.appendChild(div);
            state.lastMessageId = msg.id;

            if (scroll) scrollToBottom();

            // Hide typing indicator when LLM message arrives
            if (msg.speaker_type.startsWith('llm')) {
                showTypingIndicator(false);
            }
        }

        function sendMessage() {
            const input = $('#messageInput');
            const content = input.value.trim();
            if (!content) return;

            send('send_message', {
                content,
                type: state.messageType,
            });

            input.value = '';
            input.style.height = 'auto';
        }

        function showTypingIndicator(show, text = '') {
            const indicator = $('#typingIndicator');
            indicator.classList.toggle('active', show);
            if (text) $('#typingText').textContent = text;
        }

        function scrollToBottom() {
            const container = $('#messages');
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // THREADS
        // ============================================================
        async function loadThreads() {
            try {
                const threads = await api('GET', `/rooms/${state.roomId}/threads`);
                state.threads = threads;
                renderThreads();

                // Set current thread if not set
                if (!state.currentThreadId && threads.length > 0) {
                    switchThread(threads[0].id);
                }
            } catch (e) {
                console.error('Failed to load threads:', e);
            }
        }

        function renderThreads() {
            const select = $('#threadSelect');
            const list = $('#threadList');

            // Update select
            select.innerHTML = state.threads.map(t =>
                `<option value="${t.id}" ${t.id === state.currentThreadId ? 'selected' : ''}>
                    ${t.title || 'Thread'} (${t.message_count})
                </option>`
            ).join('');

            // Update list
            list.innerHTML = state.threads.map(t => `
                <div class="thread-item ${t.id === state.currentThreadId ? 'active' : ''}"
                     onclick="switchThread('${t.id}')">
                    <div class="thread-title">${t.title || 'Thread'}</div>
                    <div class="thread-meta">
                        ${t.message_count} messages
                        ${t.parent_thread_id ? '• forked' : ''}
                    </div>
                </div>
            `).join('');
        }

        async function switchThread(threadId) {
            state.currentThreadId = threadId;
            send('switch_thread', { thread_id: threadId });
            await loadMessages(threadId);
            renderThreads();
        }

        async function forkThread() {
            const title = $('#forkTitle').value.trim();

            try {
                await api('POST', `/threads/${state.currentThreadId}/fork`, {
                    source_thread_id: state.currentThreadId,
                    fork_after_message_id: state.lastMessageId,
                    title: title || null,
                });

                $('#forkModal').classList.remove('active');
                $('#forkTitle').value = '';
                await loadThreads();
            } catch (e) {
                alert('Failed to fork: ' + e.message);
            }
        }

        window.forkFromMessage = async function(messageId) {
            state.lastMessageId = messageId;
            $('#forkModal').classList.add('active');
        };

        // ============================================================
        // MEMORY
        // ============================================================
        async function loadMemories() {
            try {
                const memories = await api('GET', `/rooms/${state.roomId}/memories`);
                state.memories = memories;
                renderMemories();
            } catch (e) {
                console.error('Failed to load memories:', e);
            }
        }

        function renderMemories() {
            const list = $('#memoryList');

            if (state.memories.length === 0) {
                list.innerHTML = '<div class="empty-state">No memories yet</div>';
                return;
            }

            list.innerHTML = state.memories.map(m => `
                <div class="memory-item">
                    <div class="memory-key">${escapeHtml(m.key)}</div>
                    <div class="memory-content">${escapeHtml(m.content)}</div>
                    <div class="memory-meta">v${m.version}</div>
                </div>
            `).join('');
        }

        async function addMemory() {
            const key = $('#memoryKey').value.trim();
            const content = $('#memoryContent').value.trim();

            if (!key || !content) {
                alert('Please fill in both key and content');
                return;
            }

            send('add_memory', { key, content });

            $('#memoryKey').value = '';
            $('#memoryContent').value = '';
        }

        // ============================================================
        // UTILS
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', initSetup);
    </script>
</body>
</html>
